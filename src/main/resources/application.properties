# ============================================================
# FreshLink Backend - COMMON configuration
#
# Shared by every profile. MUST NOT contain secrets.
# Environment-specific values: application-dev / application-prod.
# Personal machine secrets:    application-local.properties (git-ignored)
# ============================================================

spring.application.name=FreshLink Backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Persistence (environment-independent) ----
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Schema migrations ----
# Flyway owns the schema in every environment. Hibernate only ever validates
# that the entities match what the migrations produced.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# ---- Cache ----
spring.cache.type=simple

# ---- Mail (credentials come from the environment, per profile) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- JWT (the signing secret is defined per profile, never here) ----
jwt.expiration=${JWT_EXPIRATION:300000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ---- CORS ----
freshlink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Rate limiting (unauthenticated auth endpoints, per client IP) ----
app.ratelimit.enabled=${RATELIMIT_ENABLED:true}
app.ratelimit.login.capacity=${RATELIMIT_LOGIN_CAPACITY:5}
app.ratelimit.login.window-minutes=${RATELIMIT_LOGIN_WINDOW:15}
app.ratelimit.otp.capacity=${RATELIMIT_OTP_CAPACITY:3}
app.ratelimit.otp.window-minutes=${RATELIMIT_OTP_WINDOW:15}

# ---- Actuator ----
# Only health and info are exposed. The rest (env, beans, mappings, heapdump)
# leak configuration and internals, so they stay off.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Email is best-effort: OTP delivery failing does not stop the API serving
# traffic. Left enabled, an SMTP blip marks the whole app DOWN and invites an
# orchestrator to restart a process that is working perfectly well.
management.health.mail.enabled=false

# Readiness gates traffic, so it has to mean "can actually serve requests".
# The default group only reports application state and would happily report
# ready while the database was unreachable.
management.endpoint.health.group.readiness.include=readinessState,db

# ---- Matching ----
# How long a supplier has to answer a match before its claim on the supply is
# released back to the pool.
app.matching.pending-timeout-hours=${MATCH_PENDING_TIMEOUT_HOURS:24}

# ---- Pagination ----
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---- Notifications ----
# Transactional email is sent after commit on a bounded background pool, so a
# slow or dead SMTP server cannot delay or fail a request.
app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
