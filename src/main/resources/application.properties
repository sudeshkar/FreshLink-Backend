# ============================================================
# FreshLink Backend - COMMON configuration
#
# Shared by every profile. MUST NOT contain secrets.
# Environment-specific values: application-dev / application-prod.
# Personal machine secrets:    application-local.properties (git-ignored)
# ============================================================

spring.application.name=FreshLink Backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Persistence (environment-independent) ----
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Schema migrations ----
# Flyway owns the schema in every environment. Hibernate only ever validates
# that the entities match what the migrations produced.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# ---- Cache ----
spring.cache.type=simple

# ---- Mail (credentials come from the environment, per profile) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- JWT (the signing secret is defined per profile, never here) ----
jwt.expiration=${JWT_EXPIRATION:300000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ---- CORS ----
freshlink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
