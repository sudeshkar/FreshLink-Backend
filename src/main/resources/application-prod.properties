# ============================================================
# PROD profile - every secret is injected from the environment.
#
# Deliberately no defaults: a missing variable fails the app at startup
# rather than silently falling back to a development value.
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.show-sql=false

# Destroying a production schema must never be one config flag away.
spring.flyway.clean-disabled=true
# Refuse to run against a non-empty database that has no migration history,
# rather than silently assuming it already matches V1.
spring.flyway.baseline-on-migrate=false

jwt.secret=${JWT_SECRET}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Demo/seed data must never run against production.
app.bootstrap.enabled=false

# Do not leak internals in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.root=WARN
logging.level.com.freshlink=INFO
