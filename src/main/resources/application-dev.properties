# ============================================================
# DEV profile - local development.
#
# Every value has a safe local default so the app runs out of the box,
# but each one can be overridden by an environment variable or by
# application-local.properties. No real credentials belong in this file.
# ============================================================

# Per-developer override file, loaded if present. It must be imported HERE
# rather than from application.properties: a profile-specific file outranks
# the base file and everything the base file imports, so an import declared
# there would lose to the defaults below.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/FL_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema comes from the same migrations prod uses, so drift shows up here
# first rather than at deploy time. AdminBootstrap still seeds demo data on
# top (its inserts are guarded by count checks, so restarts are safe).
#
# To reset a local database completely:
#   ./mvnw flyway:clean flyway:migrate  (allowed by the setting below)
spring.flyway.clean-disabled=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dev-only signing key. 64 chars = 512 bits, comfortably above the
# 256-bit minimum HS256 requires. Never reuse this outside dev.
jwt.secret=${JWT_SECRET:dev-only-insecure-signing-key-override-me-0123456789abcdef}

# Left blank by default: OTP mails simply fail to send locally unless you
# supply credentials in application-local.properties.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Bootstrap and demo data seeding (dev only - see AdminBootstrap).
app.bootstrap.enabled=true
app.admin.email=${ADMIN_EMAIL:admin@freshlink.local}
app.admin.password=${ADMIN_PASSWORD:DevAdmin#12345}

logging.level.com.freshlink=DEBUG
server.error.include-stacktrace=on_param

# Full health detail locally; production hides it (see application-prod).
management.endpoint.health.show-details=always
