name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # The default token is read-only, so publishing the test report fails with
    # "Resource not accessible by integration" unless checks:write is granted.
    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      # The context-load test and Flyway both need a real database; the schema
      # is PostgreSQL-specific, so an in-memory substitute would not prove much.
      # Redis is optional at runtime, but the Redis-backed limiter and cache
      # cannot be verified without it, and this machine has no Docker.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: FL_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/FL_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          # Must clear the 32-byte minimum JwtUtil enforces at startup.
          JWT_SECRET: ci-only-signing-key-not-used-anywhere-else-0123456789
          # Presence of this enables RedisBackedIT, which is skipped otherwise.
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: mvn -B verify

      - name: Publish test report
        # Runs even when tests fail, which is exactly when the report matters.
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          fail_on_failure: true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        # Not pushed anywhere; this only proves the Dockerfile still builds.
        run: docker build -t freshlink-backend:${{ github.sha }} .
